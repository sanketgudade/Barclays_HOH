<!DOCTYPE html>
<html>
<head>
<title>Admin Dashboard - SAR Genie</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{
font-family:'Inter',sans-serif;
background:linear-gradient(135deg,#1e293b,#0f172a);
color:white;
padding:30px;
}
.card{
background:#1e293b;
padding:20px;
border-radius:16px;
margin-bottom:20px;
}
button{
padding:8px 14px;
border:none;
border-radius:6px;
margin-right:10px;
cursor:pointer;
}
.approve{background:#16a34a;color:white;}
.reject{background:#dc2626;color:white;}
</style>
</head>
<body>

<h2>Admin Dashboard</h2>

<div class="card">
<h3>Pending SAR</h3>
<p><strong>Case:</strong> C101</p>
<p><strong>Status:</strong> Submitted</p>

<textarea style="width:100%;height:150px;">
Sample SAR narrative submitted by Analyst...
</textarea>
<br><br>

<button class="approve" onclick="approve()">Approve</button>
<button class="reject" onclick="reject()">Reject</button>

</div>

<div class="card">
<h3>Audit Logs</h3>
<div id="adminLogs"></div>
</div>

<script>
function approve(){
document.getElementById("adminLogs").innerHTML += "Admin Approved SAR C101<br>";
alert("SAR Approved");
}
function reject(){
document.getElementById("adminLogs").innerHTML += "Admin Rejected SAR C101<br>";
alert("SAR Rejected");
}
</script>

</body>
</html>
