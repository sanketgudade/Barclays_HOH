<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login · SAR Shield</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Tailwind + Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #030712;
            color: #f8fafc;
        }

        .bg-premium {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(6, 182, 212, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(139, 92, 246, 0.15) 0%, transparent 50%);
            z-index: -1;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border-radius: 24px;
        }

        .input-field {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 14px;
            color: #f8fafc;
            width: 100%;
            transition: all 0.3s;
        }

        .input-field:focus {
            outline: none;
            border-color: #06b6d4;
            box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.2);
        }

        .btn-gradient {
            background: linear-gradient(135deg, #06b6d4, #8b5cf6);
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(6, 182, 212, 0.3);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 12px;
            transition: 0.3s;
        }

        .btn-outline:hover {
            border-color: #06b6d4;
            background: rgba(255, 255, 255, 0.02);
        }
    </style>
</head>

<body>
<div class="bg-premium"></div>

<div class="min-h-screen flex items-center justify-center px-6">

    <div class="glass-card w-full max-w-md p-10 shadow-2xl">

        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="flex justify-center items-center gap-3 mb-4">
                            <img src="Sar_logo.png" alt="SAR Shield Logo" class="w-14 h-14 object-contain">

                <span class="text-xl font-semibold">SAR<span class="text-[#94a3b8]">Shield</span></span>
            </div>
            <h2 class="text-2xl font-bold">Welcome Back</h2>
            <p class="text-[#94a3b8] text-sm mt-2">Sign in to access your compliance dashboard</p>
        </div>

        <!-- Login Form -->
        <form onsubmit="event.preventDefault(); window.location.href='dashboard.html'">

            <div class="mb-5">
                <label class="block text-sm text-[#94a3b8] mb-2">Email Address</label>
                <input type="email" class="input-field" placeholder="analyst@bank.com" required>
            </div>

            <div class="mb-6">
                <label class="block text-sm text-[#94a3b8] mb-2">Password</label>
                <input type="password" class="input-field" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn-gradient w-full text-white">
                <i class="fa-solid fa-arrow-right mr-2"></i> Sign In
            </button>
        </form>

        <!-- Divider -->
        <div class="text-center text-xs text-[#4b5563] my-6">
            OR QUICK ACCESS
        </div>

        <!-- Role Buttons -->
        <div class="grid grid-cols-2 gap-4">
            <button onclick="window.location.href='dashboard.html'" class="btn-outline text-sm">
                <i class="fa-solid fa-user mr-2"></i> Analyst
            </button>
            <button onclick="window.location.href='Admin_dashboard.html'" class="btn-outline text-sm">
                <i class="fa-solid fa-shield-halved mr-2"></i> Admin
            </button>
        </div>

        <!-- Back -->
        <div class="text-center mt-8 text-xs text-[#4b5563]">
            <a href="index.html" class="hover:text-[#06b6d4] transition">
                <i class="fa-solid fa-arrow-left mr-1"></i> Back to Home
            </a>
        </div>

    </div>
</div>

</body>
</html>
