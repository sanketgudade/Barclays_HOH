<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analyst Dashboard - SAR Genie</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body {
    font-family: 'Inter', sans-serif;
    margin: 0;
    background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
}

.container {
    padding: 30px;
    background: #f8fafc;
    min-height: 100vh;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 16px;
    margin-bottom: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}

h2 {
    margin-top: 0;
}

button {
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    cursor: pointer;
}

textarea {
    width: 100%;
    height: 180px;
    border-radius: 8px;
    padding: 10px;
    border: 1px solid #ddd;
}

.case-item {
    padding: 8px;
    border-bottom: 1px solid #eee;
    cursor: pointer;
}
.case-item:hover {
    background: #f1f5f9;
}

.audit-log {
    font-size: 13px;
    background: #0f172a;
    color: #e2e8f0;
    padding: 15px;
    border-radius: 12px;
    height: 180px;
    overflow-y: auto;
}
</style>
</head>

<body>

<div class="container">

<h2>Analyst Dashboard</h2>

<div class="card">
<h3>Cases</h3>

<div id="caseList"></div>
</div>

<div class="card" id="caseDetails" style="display:none;">
<h3>Case Details</h3>
<p><strong>Case ID:</strong> <span id="caseId"></span></p>
<p><strong>Customer Type:</strong> <span id="customerType"></span></p>
<p><strong>Amount:</strong> <span id="amount"></span></p>
<p><strong>Risk:</strong> <span id="risk"></span></p>
<p><strong>Flag Reason:</strong> <span id="flag"></span></p>

<button onclick="generateSAR()">Generate SAR</button>
</div>

<div class="card" id="sarSection" style="display:none;">
<h3>SAR Narrative (Editable)</h3>
<textarea id="sarText"></textarea>
<br><br>
<button onclick="approveSAR()">Submit for Admin Approval</button>
<button onclick="downloadPDF()">Download PDF</button>
</div>

<div class="card">
<h3>Audit Trail</h3>
<div class="audit-log" id="auditLog"></div>
</div>

</div>

<script>

const cases = [
{
case_id:"C101",
customer_type:"Individual",
amount:950000,
risk:"High",
flag:"Offshore transfer"
},
{
case_id:"C102",
customer_type:"Corporate",
amount:250000,
risk:"Medium",
flag:"Layered transaction"
}
];

let selectedCase = null;
let sarVersion = 1;

function logAction(action, caseId="") {
const log = document.getElementById("auditLog");
const time = new Date().toLocaleTimeString();
log.innerHTML += `${time} | Analyst | ${action} | ${caseId}<br>`;
}

function loadCases(){
const list = document.getElementById("caseList");
cases.forEach(c=>{
const div = document.createElement("div");
div.className="case-item";
div.innerText = c.case_id + " - " + c.risk;
div.onclick=()=>selectCase(c);
list.appendChild(div);
});
}

function selectCase(c){
selectedCase=c;
document.getElementById("caseDetails").style.display="block";
document.getElementById("caseId").innerText=c.case_id;
document.getElementById("customerType").innerText=c.customer_type;
document.getElementById("amount").innerText=c.amount;
document.getElementById("risk").innerText=c.risk;
document.getElementById("flag").innerText=c.flag;
logAction("Viewed Case",c.case_id);
}

function generateSAR(){
if(!selectedCase) return;

document.getElementById("sarSection").style.display="block";

const prompt = `
Generate a Suspicious Activity Report in regulatory tone.
Customer Type: ${selectedCase.customer_type}
Risk Category: ${selectedCase.risk}
Amount: ${selectedCase.amount}
Flag Reason: ${selectedCase.flag}
`;


// 🔹 STATIC MOCK (replace with Gemini API call later)
const mockResponse = `
SAR Version ${sarVersion}:

This Suspicious Activity Report is being filed regarding a ${selectedCase.customer_type} customer involving a transaction amounting to ${selectedCase.amount}. The activity has been categorized as ${selectedCase.risk} risk due to ${selectedCase.flag}. Further internal review is recommended in accordance with AML regulatory guidelines.
`;

document.getElementById("sarText").value = mockResponse;

logAction("Generated SAR v"+sarVersion, selectedCase.case_id);
sarVersion++;
}

function approveSAR(){
logAction("Submitted SAR for Approval", selectedCase.case_id);
alert("SAR submitted to Admin.");
}

function downloadPDF(){
const { jsPDF } = window.jspdf;
const doc = new jsPDF();
doc.text(document.getElementById("sarText").value,10,10);
doc.save("SAR_"+selectedCase.case_id+".pdf");
logAction("Downloaded SAR", selectedCase.case_id);
}

loadCases();
logAction("Login");

</script>

</body>
</html>
